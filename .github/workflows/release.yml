name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Build admin UI
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build

      - name: Test backend
        run: cargo test --all-targets

      - name: Lint backend
        run: cargo clippy --all-targets -- -D warnings

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: nsm-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nsm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build admin UI
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect artifact (unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/nsm ${{ matrix.artifact }}

      - name: Collect artifact (windows)
        if: matrix.os == 'windows-latest'
        run: Copy-Item target/${{ matrix.target }}/release/nsm.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nsm-linux-x64
            nsm-windows-x64.exe
