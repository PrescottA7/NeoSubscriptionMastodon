[package]
name = "nsm"
version = "0.1.0"
edition = "2024"
description = "NeoSubscriptionMastodon - proxy subscription manager with multi-core config rendering"
build = "build.rs"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
argon2 = "0.5"
axum = "0.8.9"
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio"] }
mime_guess = "2.0.5"
rand = "0.8"
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
webpki-roots = "1.0.11"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
